# Porta: o Render define a variável PORT automaticamente
server.port=${PORT:8080}

# Banco de dados.
# Sem DATABASE_URL, usa um banco em memória (some ao reiniciar) - bom para testes locais.
# No Render, defina DATABASE_URL, DB_USER e DB_PASSWORD com os dados do Supabase.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:estuda;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5

# Cria/atualiza as tabelas sozinho a partir das classes Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
