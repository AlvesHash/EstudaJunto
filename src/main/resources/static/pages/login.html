<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar — Estuda Junto</title>
    <link rel="stylesheet" href="/css/globals/global.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="/">Estuda <span>Junto</span></a>
      <nav class="header-buttons">
        <a class="btn btn-outline" href="/">Início</a>
      </nav>
    </header>
    <main class="form-container">
      <section class="form-card">
        <div class="form-header">
          <div class="form-icon">🎓</div>
          <h1>Bem-vindo de volta!</h1>
          <p>Entre na sua conta e continue aprendendo.</p>
        </div>
        <div id="message" class="hidden" role="status"></div>
        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail</label
            ><input
              type="email"
              id="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>
          <div class="field">
            <label for="password">Senha</label
            ><input
              type="password"
              id="password"
              autocomplete="current-password"
              placeholder="Sua senha"
              required
            />
          </div>
          <button class="btn btn-blue" type="submit">Entrar</button>
        </form>
        <div class="form-footer">
          Ainda não possui conta? <a href="/cadastro">Criar conta</a>
        </div>
        <p class="password-help">
          Suas contas e discussões ficam salvas no servidor do Estuda Junto.
        </p>
      </section>
    </main>
    <footer class="footer">© 2026 Estuda Junto</footer>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
