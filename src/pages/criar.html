<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Criar discussão — Estuda Junto</title>
    <link rel="stylesheet" href="/css/globals/global.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="/">Estuda <span>Junto</span></a>
      <div class="search">
        <input
          id="searchInput"
          type="search"
          placeholder="Pesquisar discussões"
          aria-label="Pesquisar discussões"
        />
      </div>
      <nav class="header-buttons" data-auth-links></nav>
    </header>
    <main class="container" style="max-width: 820px">
      <a href="/" class="muted">← Voltar para discussões</a>
      <section class="card" style="margin-top: 15px">
        <div class="welcome">
          <h1>Criar nova discussão</h1>
          <p>Compartilhe uma dúvida, uma ideia ou algo que você aprendeu.</p>
        </div>
        <div id="message" class="hidden" role="status"></div>
        <form id="discussionForm">
          <div class="field">
            <label for="title">Título da discussão</label
            ><input
              id="title"
              maxlength="150"
              placeholder="Ex.: Como resolver equações do segundo grau?"
              required
            /><small>Use um título direto, que explique o assunto.</small>
          </div>
          <div class="field">
            <label for="category">Categoria</label
            ><select id="category" required>
              <option value="">Selecione uma categoria</option>
              <option>História</option>
              <option>Matemática</option>
              <option>Ciências</option>
              <option>Português</option>
              <option>Tecnologia</option>
              <option>Filosofia</option>
              <option>Geografia</option>
              <option>Outros</option>
            </select>
          </div>
          <div class="field">
            <label for="tags">Tags (opcional)</label
            ><input
              id="tags"
              maxlength="100"
              placeholder="Ex.: Brasil, Ensino Médio, prova"
            /><small>Separe as tags por vírgulas.</small>
          </div>
          <div class="field">
            <label for="question">Conteúdo</label
            ><textarea
              id="question"
              minlength="10"
              maxlength="5000"
              placeholder="Explique sua dúvida ou desenvolva o assunto..."
              required
            ></textarea>
          </div>
          <div class="actions">
            <a class="btn btn-secondary" href="/">Cancelar</a
            ><button class="btn btn-blue" type="submit">
              Publicar discussão
            </button>
          </div>
        </form>
      </section>
    </main>
    <footer class="footer">© 2026 Estuda Junto</footer>
    <script type="module" src="/js/criar.js"></script>
  </body>
</html>
